appId: com.thedandarak.vavilon
productName: Vavilon
copyright: Copyright © 2026 TheDanDARAK

# GitHub Releases feed for electron-updater ("обновления по воздуху").
# The first provider is written into resources/app-update.yml inside the build
# and is what the launcher polls. Publish with: GH_TOKEN=... npm run dist -- --publish always
publish:
  provider: github
  owner: TheDanDARAK
  repo: vavilon
  releaseType: release

directories:
  buildResources: resources
  output: release

# electron-vite output: out/main (main), out/preload, out/renderer
files:
  - out/**
  - "!**/*.tsbuildinfo"

asar: true

# external binaries bundled next to the app (not inside asar):
# resources/binaries/ludusavi.exe -> <install>\resources\binaries\ludusavi.exe
extraResources:
  - from: resources/binaries
    to: binaries
    filter:
      - "**/*"
  - from: resources/tray.png
    to: tray.png

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vavilon
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
